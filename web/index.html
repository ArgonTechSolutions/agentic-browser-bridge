<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentic Browser Bridge · Argon</title>
  <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="idle-setting">
      <button id="idle" class="toggle" type="button" role="switch" aria-label="Idle shutdown" aria-checked="true" disabled><span class="switch-thumb" aria-hidden="true"></span></button>
      <span>Idle shutdown</span>
    </div>
    <div class="ownership">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="mode" role="status" aria-live="polite">Connecting…</span>
      <button id="control" class="toggle" type="button" role="switch" aria-label="Agent control" aria-checked="false" aria-describedby="control-help" disabled>
        <span class="switch-thumb" aria-hidden="true"></span>
      </button>
      <span id="control-help" class="sr-only">Turn on to give the agent control. Turn off to take control yourself.</span>
    </div>
  </header>
  <main>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden>
      <span id="message"></span>
      <button id="reconnect" type="button" hidden>Reconnect</button>
    </div>
    <div id="reminder" class="reminder" role="status" hidden>
      <p>Your browser is set to keep running. Do you still need it?</p>
      <button id="enable-idle" type="button">Enable idle shutdown</button><button id="keep-running" type="button">Keep running</button>
    </div>
    <div id="sleep" class="sleep" hidden><p id="sleep-message">Browser sleeping</p><button id="wake" type="button">Wake browser</button></div>
    <div id="screen" aria-label="Remote browser workspace"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>

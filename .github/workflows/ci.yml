name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: docker build -t abb:test .
      - name: Start disposable workspace
        run: |
          HASH=$(node --input-type=module -e "import {scryptSync} from 'node:crypto'; console.log('00'.repeat(16)+':'+scryptSync('fixture-password',Buffer.alloc(16),64).toString('hex'))")
          docker run -d --name abb-smoke --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 1536m --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            -p 127.0.0.1:17080:8080 -e ABB_VIEWER_PASSWORD_HASH="$HASH" abb:test
          for i in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' abb-smoke)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs abb-smoke
          docker exec abb-smoke cat /tmp/chromium.log /tmp/x11vnc.log
          exit 1
      - name: Real browser and noVNC integration
        run: |
          npx playwright-core install --with-deps chromium
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")
          export CHROMIUM_PATH
          npm run test:browser
          node test/container-smoke.js
      - name: Compose contract
        run: |
          ABB_VIEWER_PASSWORD_HASH="$(printf '%032d:%0128d' 0 0)" docker compose config --quiet
      - name: Cleanup
        if: always()
        run: docker rm -f abb-smoke || true

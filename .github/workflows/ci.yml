name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: docker build -t abb:test .
      - name: Real browser and noVNC integration
        run: ./scripts/test-container.sh abb:test

      - name: Unenrolled Tailscale connector smoke
        run: ABB_CONNECTOR_TEST_IMAGE=abb:test ./scripts/test-connector.sh

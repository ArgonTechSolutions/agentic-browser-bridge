name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact VERSION, e.g. 0.1.0-alpha.1 (must match checked out source)'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate immutable version and successful CI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$VERSION" = "$(cat VERSION)"
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo 'Release already exists; use a new version.'; exit 1; fi
          git fetch --tags
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo 'Tag already exists.'; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | any(.head_sha == "'"$GITHUB_SHA"'" and .event == "push")' | grep -qx true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and test the exact release image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm run check && npm test
          docker build -t "ghcr.io/argontechsolutions/agentic-browser-bridge:$VERSION" .
          ./scripts/test-container.sh "ghcr.io/argontechsolutions/agentic-browser-bridge:$VERSION"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and verify anonymous distribution
        id: image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE="ghcr.io/argontechsolutions/agentic-browser-bridge:$VERSION"
          docker push "$IMAGE"
          ANON_CONFIG=$(mktemp -d)
          trap 'rm -rf "$ANON_CONFIG"' EXIT
          docker --config "$ANON_CONFIG" pull "$IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          printf 'digest=%s\n' "${DIGEST##*@}" >> "$GITHUB_OUTPUT"
      - name: Publish checksummed source bundle and prerelease
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="agentic-browser-bridge-$VERSION/" HEAD > "dist/agentic-browser-bridge-$VERSION.tar.gz"
          printf 'ghcr.io/argontechsolutions/agentic-browser-bridge@%s\n' "$IMAGE_DIGEST" > dist/IMAGE_DIGEST.txt
          (cd dist && sha256sum "agentic-browser-bridge-$VERSION.tar.gz" > SHA256SUMS)
          cp docs/release-notes.md dist/NOTES.md
          printf '\nContainer digest: `%s`\n' "$IMAGE_DIGEST" >> dist/NOTES.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --prerelease --title "v$VERSION — shared browser workspace alpha" --notes-file dist/NOTES.md dist/*.tar.gz dist/SHA256SUMS dist/IMAGE_DIGEST.txt

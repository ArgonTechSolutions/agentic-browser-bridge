name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact VERSION, e.g. 0.1.0-alpha.1 (must match checked out source)'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable version and successful CI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$VERSION" = "$(cat VERSION)"
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo 'Release already exists; use a new version.'; exit 1; fi
          git fetch --tags
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo 'Tag already exists.'; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | any(.head_sha == "'"$GITHUB_SHA"'" and .event == "push")' | grep -qx true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and test the exact release image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm run check && npm test
          docker build -t "argon/agentic-browser-bridge:$VERSION" .
          ./scripts/test-container.sh "argon/agentic-browser-bridge:$VERSION"
      - name: Export tested image and publish checksummed release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="agentic-browser-bridge-$VERSION/" HEAD > "dist/agentic-browser-bridge-$VERSION.tar.gz"
          docker image save "argon/agentic-browser-bridge:$VERSION" | gzip -1 > "dist/agentic-browser-bridge-$VERSION-linux-amd64.tar.gz"
          test "$(stat -c %s "dist/agentic-browser-bridge-$VERSION-linux-amd64.tar.gz")" -lt 2000000000
          docker image inspect --format '{{.Id}}' "argon/agentic-browser-bridge:$VERSION" > dist/IMAGE_ID.txt
          (cd dist && sha256sum *.tar.gz IMAGE_ID.txt > SHA256SUMS)
          cp docs/release-notes.md dist/NOTES.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --prerelease --title "v$VERSION — shared browser workspace alpha" --notes-file dist/NOTES.md dist/*.tar.gz dist/SHA256SUMS dist/IMAGE_ID.txt

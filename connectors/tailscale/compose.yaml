# Standalone connector: no Browser Bridge dependency and no published proxy port.
services:
  tailscale-proxy:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    entrypoint: [tailscaled]
    command:
      - --tun=userspace-networking
      - --state=/var/lib/tailscale/tailscaled.state
      - --socket=/tmp/tailscaled.sock
      - --socks5-server=0.0.0.0:1055
      - --outbound-http-proxy-listen=0.0.0.0:1055
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks: [proxy]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
volumes:
  tailscale-state:
networks:
  proxy:
